name: Deploy Citation Dashboard

# Manual deploy trigger only. Automatic deploys happen via update_citations.yml
# after the full pipeline generates the dashboard.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and deploy dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e .

      - name: Generate dashboard
        run: |
          mkdir -p dashboard_data/{network,themes,temporal,visualizations}

          echo "Generating theme analysis..."
          python -m dataset_citations.analysis.generate_themes \
            --citations-dir citations/json \
            --output-dir dashboard_data/themes || echo "Theme generation had issues"

          echo "Generating network analysis..."
          python -m dataset_citations.analysis.generate_network \
            --citations-dir citations/json \
            --output-dir dashboard_data/network || echo "Network analysis had issues"

          echo "Generating temporal analysis..."
          python -m dataset_citations.analysis.generate_temporal \
            --citations-dir citations/json \
            --output-dir dashboard_data/temporal || echo "Temporal analysis had issues"

          echo "Building dashboard..."
          python -c "
          from dataset_citations.dashboard.core import DashboardGenerator
          from pathlib import Path
          gen = DashboardGenerator(
              results_dir=Path('dashboard_data'),
              output_dir=Path('interactive_reports'),
              citations_dir=Path('citations/json'),
          )
          output_path = gen.generate_dashboard(dashboard_type='nemar', lazy_load=True)
          print(f'Dashboard generated: {output_path}')
          "

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy/citations
          cp interactive_reports/dataset_citations_dashboard_nemar.html deploy/citations/index.html
          cp interactive_reports/dashboard_styles.css deploy/citations/
          cp interactive_reports/dashboard_templates.js deploy/citations/
          cp -r interactive_reports/data deploy/citations/data

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy deploy --project-name nemar-dashboard --branch main
