name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff format check
        run: ruff format --check src/ tests/

      - name: Run ruff lint
        run: ruff check src/ tests/

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only PyTorch first to avoid CUDA dependencies
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,test]"

      - name: Run fast tests with coverage
        run: |
          pytest tests/ \
            --cov=dataset_citations \
            --cov-report=xml \
            --cov-report=term-missing \
            -v \
            --maxfail=5

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only PyTorch first to avoid CUDA dependencies
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,test]"

      - name: Create test data directory
        run: |
          mkdir -p tests/test_data/workflow_test

          # Create minimal test dataset list
          echo "ds003555" > tests/test_data/workflow_test/discovered_datasets.txt

          # Create previous citations CSV
          cat > tests/test_data/workflow_test/previous_citations.csv << 'EOF'
          dataset_id,citation_count,last_updated
          ds003555,8,2024-01-01
          EOF

      - name: Run integration tests
        run: |
          # Run workflow test with test data
          python -m pytest tests/test_getCitations.py::TestGetCitations::test_minimal_workflow \
            -v \
            --tb=short
        continue-on-error: true

      - name: Test CLI commands
        run: |
          # Test discovery
          dataset-citations-discover --help

          # Test migration
          dataset-citations-migrate --help

          # Test dashboard generation with mock data
          mkdir -p test_results/temporal_analysis test_results/network_analysis
          echo '{"test": "data"}' > test_results/temporal_analysis/results.json

          dataset-citations-create-interactive-reports \
            --results-dir test_results \
            --output-dir test_output \
            --verbose || true

          # Check if dashboard was created
          if [ -f "test_output/dataset_citations_dashboard.html" ]; then
            echo "Dashboard generated successfully"
            ls -lh test_output/*.html
          else
            echo "Dashboard generation test completed (may have warnings)"
          fi

  end-to-end-test:
    name: End-to-End Workflow Test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only PyTorch first to avoid CUDA dependencies
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,test]"

      - name: Run end-to-end workflow test
        run: |
          # Make script executable
          chmod +x run_end_to_end_workflow.sh

          # Run test mode (no API calls)
          ./run_end_to_end_workflow.sh test

          # Check outputs
          if [ -d "test_output_*" ]; then
            echo "Test outputs created successfully"
            find test_output_* -type f -name "*.html" -o -name "*.json" | head -20
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-outputs
          path: |
            test_output_*/
            logs/
          retention-days: 7

  security-check:
    name: Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'