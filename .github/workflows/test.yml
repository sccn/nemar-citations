name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  UV_PYTHON: "3.13"
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install ruff + ty
        run: uv tool install ruff && uv tool install ty

      - name: Ruff format check
        run: uv tool run ruff format --check src/ tests/

      - name: Ruff lint
        run: uv tool run ruff check src/ tests/

      - name: Ty type check
        run: uv tool run ty check src/ || true  # ty is preview; do not fail CI yet

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Sync project (CPU-only torch index)
        env:
          UV_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
          UV_INDEX_STRATEGY: unsafe-best-match
        run: uv sync --python ${{ matrix.python-version }} --all-extras

      - name: Run fast tests with coverage
        run: |
          uv run pytest tests/ \
            --cov=dataset_citations \
            --cov-report=xml \
            --cov-report=term-missing \
            -v \
            --maxfail=5

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync project
        env:
          UV_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
          UV_INDEX_STRATEGY: unsafe-best-match
        run: uv sync --python 3.13 --all-extras

      - name: Create test data directory
        run: |
          mkdir -p tests/test_data/workflow_test
          echo "ds003555" > tests/test_data/workflow_test/discovered_datasets.txt
          cat > tests/test_data/workflow_test/previous_citations.csv << 'EOF'
          dataset_id,citation_count,last_updated
          ds003555,8,2024-01-01
          EOF

      - name: Run integration tests
        run: |
          uv run pytest tests/test_getCitations.py::TestGetCitations::test_minimal_workflow \
            -v --tb=short
        continue-on-error: true

      - name: Test CLI commands
        run: |
          uv run dataset-citations-discover --help
          uv run dataset-citations-migrate --help

          mkdir -p test_results/temporal_analysis test_results/network_analysis
          echo '{"test": "data"}' > test_results/temporal_analysis/results.json

          uv run dataset-citations-create-reports \
            --results-dir test_results \
            --output-dir test_output \
            --verbose || true

          if [ -f "test_output/dataset_citations_dashboard.html" ]; then
            echo "Dashboard generated successfully"
            ls -lh test_output/*.html
          else
            echo "Dashboard generation test completed (may have warnings)"
          fi

  end-to-end-test:
    name: End-to-End Workflow Test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync project
        env:
          UV_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
          UV_INDEX_STRATEGY: unsafe-best-match
        run: uv sync --python 3.13 --all-extras

      - name: Run end-to-end workflow test
        run: |
          chmod +x run_end_to_end_workflow.sh
          ./run_end_to_end_workflow.sh test

          if [ -d "test_output_*" ]; then
            echo "Test outputs created successfully"
            find test_output_* -type f -name "*.html" -o -name "*.json" | head -20
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-outputs
          path: |
            test_output_*/
            logs/
          retention-days: 7

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
